<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Danışman Kayıt</title>
</head>
<body>
  <h2>Danışman Kayıt</h2>
  <form id="regForm">
    <label>İsim: <input id="firstName" required></label><br>
    <label>Soyisim: <input id="lastName" required></label><br>
    <label>Şifre: <input id="password" type="password" required></label><br>
    <button type="submit">Danışman Oluştur</button>
  </form>
  <p id="msg"></p>
  <p><a href="index.html">Geri</a></p>

  <script src="storage.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = document.getElementById('firstName').value.trim();
      const l = document.getElementById('lastName').value.trim();
      const p = document.getElementById('password').value;
      const res = auth.createAdvisor(f,l,p);
      const msg = document.getElementById('msg');
      if (res.ok) {
        msg.textContent = `Danışman kaydı başarılı. Kullanıcı adı: ${res.username}`;
        setTimeout(()=> window.location.href='login.html', 2000);
      } else {
        msg.textContent = res.message;
      }
    });
  </script>
</body>
</html>
